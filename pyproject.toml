[project]
name = "usp-gene-correlation"
version = "0.1.0"
description = "Cohort genotype frequencies with pluggable SNP annotations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "pandas>=2.3.3",
    "pysam>=0.23.3",
    "typer>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
usp-gene-correlation = "usp_gene_correlation.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
